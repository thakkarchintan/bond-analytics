services:
  - type: web
    name: bond-analytics
    runtime: python
    buildCommand: |
      pip install -r requirements-api.txt
      cd frontend && npm install && npm run build
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALLOWED_USERS
        sync: false
      - key: ADMINS
        sync: false
      - key: TOKEN_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FIREBASE_KEY_JSON
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OAUTH_REDIRECT_URI
        sync: false
      - key: LOCAL_DEV
        value: false
